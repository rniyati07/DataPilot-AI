# Docker Compose for QueryVista
# Services: frontend (nginx), backend (fastapi/uvicorn)
# Persistence: named volumes for SQLite database and uploads

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: queryvista-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - DATABASE_URL=sqlite:///./data/ecommerce.db
      - DATABASE_UPLOAD_DIR=./data/uploads
      - DATABASE_UPLOAD_MAX_MB=50
      - HARD_ROW_CEILING=1000
      - DEFAULT_MAX_ROWS=200
      - QUERY_TIMEOUT_SECONDS=15
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
    volumes:
      - queryvista-data:/app/backend/data
      - queryvista-uploads:/app/backend/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: queryvista-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  queryvista-data:
  queryvista-uploads: